# Aria 本体（完整功能）。共用部分见 electron-builder.base.yml。
#
# 产物名与输出目录刻意保持原样（release/Aria-Setup-<版本>.exe 等）：
# 这个产品的产物路径已经被文档、脚本和用户习惯引用，改它只会制造麻烦。

extends: ./electron-builder.base.yml

# 本体不用 AI 字幕（那是 player 档的能力），所以把 sherpa 运行时剔掉 —— 少 5MB 左右。
# 注意：player / unified 的配置继承 base，不受这里影响。
files:
  - '!node_modules/sherpa-onnx-node/**'
  - '!node_modules/sherpa-onnx-*/**'
  - '!**/sherpa-onnx-*/**'
  # 只排除 player 专属的 ASR worker —— 0.1.1 起 src/main/workers/ 里还有
  # music-source-worker.js（本体跑第三方音源要用），不能整目录排掉。
  - '!src/main/workers/asr-worker.js'
  # VAD 只给 player / Unified（它们跑 AI 字幕），本体不需要这 0.6MB
  - '!src/main/assets/**'

appId: com.aria.player
productName: Aria

directories:
  output: release

win:
  artifactName: Aria-Setup-${version}.${ext}

portable:
  artifactName: Aria-${version}-portable.${ext}

nsis:
  shortcutName: Aria

mac:
  artifactName: Aria-${version}-${arch}.${ext}

dmg:
  title: Aria ${version}
